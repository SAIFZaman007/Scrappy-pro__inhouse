server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the static app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 4m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed assets never change: cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # API traffic. Frontend and backend are now SEPARATE Coolify apps with
    # no shared Docker network, so `proxy_pass http://api:8000` (a compose
    # service name) cannot resolve - that was the direct cause of the 502.
    # This forwards to the backend's real public domain instead.
    #
    # Two details matter here, both easy to get wrong:
    #
    # 1. `resolver 127.0.0.11` + a variable in proxy_pass forces nginx to
    #    re-resolve the backend's DNS on every request instead of caching
    #    the IP once at container startup. Coolify assigns a new container
    #    IP on every backend redeploy - without this, the frontend would
    #    keep proxying to a dead IP until its own container restarted.
    # 2. `Host` must be overridden to the backend's own domain, not passed
    #    through from the incoming request. Coolify's edge proxy (Traefik/
    #    Caddy) routes by Host header / SNI; forwarding the frontend's Host
    #    (scrappy-pro...) here would make the edge proxy fail to match the
    #    backend's routing rule.
    # ------------------------------------------------------------------
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream https://scrappy-backend.maktechgroups.com;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host scrappy-backend.maktechgroups.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exports of tens of thousands of rows take a while to build.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Client-side routing: every unknown path falls back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}